{% macro with_errors(field) %}
<div class="form-field">
    {% if field.errors %}
        {% for error in field.errors %}
            <span class="error"> {{ error | e }}</span>
        {% endfor %}
    {{ field.label }}
    {% set css_class = 'has_error' + kwargs.pop('class', '') %}
    {{ field(class=css_class, **kwargs) }}
    {% else %}
        {{ field(**kwargs) }}
    {% endif %}
</div>
{% endmacro %}
